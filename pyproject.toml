[project]
name = "flybrainer"
version = "0.1.0"
description = "A reusable, Numba-JIT accelerated fruit-fly connectome (MaleCNS v1.0) extracted from OpenFly"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "OpenFly contributors" }
]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Life",
]
keywords = ["neuroscience", "connectomics", "fruit-fly", "neural-simulation", "numba"]

dependencies = [
    "numpy>=2.2,<2.5",
    "numba>=0.61",
    "pillow>=10",
]

[project.optional-dependencies]
feather = ["pandas>=2.2", "pyarrow>=17"]
readout = ["scikit-learn>=1.5", "scipy>=1.14", "joblib>=1.4"]
download = ["requests>=2.32"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/chnak/flybrain"
Source = "https://github.com/chnak/flybrain"
Issues = "https://github.com/chnak/flybrain/issues"
Changelog = "https://github.com/chnak/flybrain/blob/main/docs/USAGE.zh.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrainer"]

[tool.hatch.build.targets.sdist]
include = [
    "src/flybrainer/**/*.py",
    "tests/**/*.py",
    "examples/**/*.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["src/flybrainer"]
omit = ["*/tests/*", "*/examples/*"]
